# CI pipeline of PlaceFinder (from session 8).
# Every push and pull request: lint, format check and tests, also against
# PostGIS and Valkey. On master and on tags: build the image, scan it with
# Trivy, push it to the GitHub Container Registry with an SBOM and build
# provenance, and sign it with cosign - without any stored secret.
#
# Images: ghcr.io/<owner>/placefinder:<commit sha> and :<branch or tag>,
# e.g. :master or :t08. The deploy workflows of the provider repositories
# (06-infrastructure-as-code/deploy.example.yml) roll out the image of a
# successful run.
#
# Every action is pinned to the commit of a release: a tag like v7 can be
# moved to other code later (as with trivy-action in March 2026), a commit
# cannot. Dependabot proposes updates (.github/dependabot.yml).
name: ci

on:
  push:
    branches: [master]
    tags: ["t*"]
  pull_request:
  workflow_dispatch:

# least privilege: jobs ask for more only where they need it
permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # the same databases as compose.yaml, as service containers of the job
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: pf
          POSTGRES_PASSWORD: pf   # a throwaway database of this job
          POSTGRES_DB: pf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username pf"
          --health-interval 5s --health-retries 20
      valkey:
        image: valkey/valkey:9.0
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://pf:pf@localhost:5432/pf
      TEST_VALKEY_URL: valkey://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Lint and check the format
        run: |
          uv run ruff check --output-format github
          uv run ruff format --check
      - name: Test
        run: uv run pytest

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the GITHUB_TOKEN
      id-token: write   # OIDC token for keyless signing with cosign (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        # image names must be lowercase, GitHub user names need not be
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true   # into the local Docker Engine, for the scan
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.74.0      # the same Trivy as in the dev container
          severity: CRITICAL,HIGH
          ignore-unfixed: true  # only findings that an update would fix
          exit-code: "1"        # fail the pipeline on such a finding

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push with SBOM and provenance
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          sbom: true              # SPDX list of all packages, stored with the image
          provenance: mode=max    # who built what from which commit (SLSA)
          cache-from: type=gha    # the layers of the build step above

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # the certificate names this workflow and commit; the signature goes
        # to the image in ghcr.io and to the public transparency log Rekor
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          {
            echo "### Image"
            echo "\`$IMAGE@$DIGEST\`"
            echo "Tags: \`${{ github.sha }}\`, \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

[project]
name = "placefinder"
version = "0.1.0"
description = "Place search API, example project of the cloud computing course"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

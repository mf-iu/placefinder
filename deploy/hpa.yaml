# Horizontal Pod Autoscaler for PlaceFinder (extra task of session 3).
# Needs the Deployment from deploy/k8s/ and a CPU request; k3s contains the
# metrics server. Apply:  kubectl apply --filename deploy/hpa.yaml
# Watch:  kubectl get hpa --watch
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: placefinder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: placefinder
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    # percent of the CPU request

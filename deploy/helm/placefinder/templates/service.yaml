apiVersion: v1
kind: Service
metadata:
  name: {{ include "placefinder.fullname" . }}
  labels:
    {{- include "placefinder.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "placefinder.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000

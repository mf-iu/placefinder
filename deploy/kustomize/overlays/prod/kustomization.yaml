# Production overlay: namespace placefinder-prod, three pods, only warnings
# and errors in the log.
# Show:    kubectl kustomize deploy/kustomize/overlays/prod
# Apply:   kubectl apply --kustomize deploy/kustomize/overlays/prod
# Remove:  kubectl delete --kustomize deploy/kustomize/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All objects of the base go into this namespace. The names stay the same, so
# the overlays do not get in each other's way or in the way of deploy/k8s/.
namespace: placefinder-prod

resources:
  - ../../base
  - namespace.yaml

replicas:
  - name: placefinder
    count: 3

configMapGenerator:
  - name: placefinder-config
    behavior: merge                 # change one key, keep the others
    literals:
      - LOG_LEVEL=warning

# Image from the GitHub Container Registry instead of the imported one:
# images:
#   - name: placefinder
#     newName: ghcr.io/<github-user>/placefinder

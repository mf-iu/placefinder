# PlaceFinder and a second service to practise Compose.
# web is a tiny web server (BusyBox httpd, about 2 MB) that has nothing to
# do with PlaceFinder. It shows what Compose adds to docker run: a shared
# network with service names, a start order with health check and a named
# volume. PlaceFinder gets its database (PostGIS) in session 6.
# Start: docker compose up --detach   Stop: docker compose down (--volumes also deletes the volume)
services:
  api:
    build: .
    image: placefinder:0.1.0
    ports: ["8000:8000"]
    depends_on:
      # start api only after web passes its health check
      web: {condition: service_healthy}
  web:
    image: busybox:1.37
    # create a start page in the volume on the first start, then serve /www
    command: >-
      sh -c '[ -f /www/index.html ] || echo "Hello from the volume" >/www/index.html;
      exec httpd -f -p 8080 -h /www'
    ports: ["8080:8080"]
    volumes: [www:/www]
    healthcheck:
      # httpd answers 404 without index.html, so this also checks the page
      test: wget --quiet --spider http://127.0.0.1:8080/
      interval: 5s

volumes:
  www:

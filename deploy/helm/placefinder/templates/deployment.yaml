apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "placefinder.fullname" . }}
  labels:
    {{- include "placefinder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "placefinder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "placefinder.selectorLabels" . | nindent 8 }}
      annotations:
        # changes with the ConfigMap, so helm upgrade restarts the pods
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "placefinder.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:            # process only, no database
            httpGet: {path: /livez, port: 8000}
            periodSeconds: 10
            failureThreshold: 3

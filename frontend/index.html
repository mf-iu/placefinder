<!doctype html>
<!--
  Map of PlaceFinder: loads the places in the visible part of the map from
  GET /v1/places?bbox=... and draws them as circles (MapLibre GL JS 6).

  Start (dev container, second terminal):
    python3 -m http.server 5173 --directory frontend
  then open http://localhost:5173. The API runs on port 8000 and allows
  this origin via CORS (CORS_ORIGINS). Another API: ?api=https://...

  Base map: by default the vector tiles of OpenFreeMap. With ?tiles=<URL of a
  PMTiles file> (from session 7) the map reads its own tiles from one file in
  object storage, with HTTP range requests (PMTiles 4, style of Protomaps).
  The URL may be a pre-signed URL; it has to be URL-encoded.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlaceFinder</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.css">
  <!-- only for ?tiles=: reading PMTiles files and the base map style of Protomaps -->
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; }
    #status {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgb(255 255 255 / 0.9); padding: 6px 10px; border-radius: 4px;
      font-size: 14px; max-width: 60%;
    }
    #status.error { color: #b00020; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Lade …</div>
  <script type="module">
    // version 6 is an ES module only; pinned version, as everything in the course
    import * as maplibregl from "https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.mjs";

    const params = new URLSearchParams(location.search);
    const api = params.get("api") ?? "http://localhost:8000";
    const tiles = params.get("tiles");  // URL of a PMTiles file, optional
    const status = document.getElementById("status");

    // Base map from one PMTiles file: the pmtiles protocol turns each tile
    // request of MapLibre into a range request for the bytes of that tile.
    function ownTilesStyle(url) {
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);
      const archive = new pmtiles.PMTiles(url);
      protocol.add(archive);  // the file under its URL, also with a query string
      // show the area of the file: its header holds the bounding box
      archive.getHeader().then((h) => map.fitBounds(
        [[h.minLon, h.minLat], [h.maxLon, h.maxLat]], { animate: false }));
      return {
        version: 8,
        glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
        sprite: "https://protomaps.github.io/basemaps-assets/sprites/v4/light",
        sources: {
          protomaps: {
            type: "vector",
            url: `pmtiles://${url}`,
            attribution: '<a href="https://protomaps.com">Protomaps</a> © '
              + '<a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
          },
        },
        layers: basemaps.layers("protomaps", basemaps.namedFlavor("light"), { lang: "de" }),
      };
    }

    const map = new maplibregl.Map({
      container: "map",
      // no key needed for either
      style: tiles ? ownTilesStyle(tiles) : "https://tiles.openfreemap.org/styles/liberty",
      center: [11.03, 50.98],  // Erfurt: lon, lat
      zoom: 7,
      customAttribution: "Orte: GeoNames (CC BY 4.0)",
    });
    map.addControl(new maplibregl.NavigationControl());

    let pending;  // request still running, cancelled by the next one

    async function loadPlaces() {
      const b = map.getBounds();
      // the API accepts longitudes from -180 to 180 only
      const bbox = [
        Math.max(-180, b.getWest()), Math.max(-90, b.getSouth()),
        Math.min(180, b.getEast()), Math.min(90, b.getNorth()),
      ].map((v) => v.toFixed(4)).join(",");
      const url = `${api}/v1/places?bbox=${bbox}&sort=-population&limit=100`;
      pending?.abort();
      pending = new AbortController();
      try {
        const response = await fetch(url, { signal: pending.signal });
        const body = await response.json();
        if (!response.ok) {
          // problem details (RFC 9457): detail for people, type for programs
          throw new Error(`${response.status} ${body.title}: ${body.detail ?? ""}`);
        }
        map.getSource("places").setData(body);
        const more = body.links.some((link) => link.rel === "next") ? " (die größten)" : "";
        status.textContent = `${body.features.length} Orte im Ausschnitt${more}`;
        status.className = "";
      } catch (error) {
        if (error.name === "AbortError") return;
        status.textContent = `Fehler: ${error.message}`;
        status.className = "error";
      }
    }

    map.on("load", () => {
      map.addSource("places", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] },
      });
      map.addLayer({
        id: "places",
        type: "circle",
        source: "places",
        paint: {
          // larger circles for larger places
          "circle-radius": [
            "interpolate", ["linear"], ["get", "population"],
            15000, 4, 1000000, 14,
          ],
          "circle-color": "#00b4d8",
          "circle-stroke-color": "#003049",
          "circle-stroke-width": 1,
          "circle-opacity": 0.8,
        },
      });
      map.addLayer({
        id: "names",
        type: "symbol",
        source: "places",
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Regular"],
          "text-size": 12,
          "text-offset": [0, 1.2],
          "text-anchor": "top",
        },
      });
      loadPlaces();
    });
    map.on("moveend", loadPlaces);

    map.on("click", "places", (event) => {
      const place = event.features[0];
      const p = place.properties;
      // build the popup from text nodes, never from HTML: the data come from an
      // API, and names could contain markup (OWASP API10)
      const content = document.createElement("div");
      const name = document.createElement("b");
      name.textContent = p.name;
      const link = document.createElement("a");
      link.href = `${api}/v1/places/${encodeURIComponent(place.id)}`;
      link.target = "_blank";
      link.textContent = "GeoJSON";
      content.append(
        name, ` (${p.country_code})`, document.createElement("br"),
        `${Number(p.population).toLocaleString("de-DE")} Einwohner`,
        document.createElement("br"), link,
      );
      new maplibregl.Popup().setLngLat(place.geometry.coordinates).setDOMContent(content).addTo(map);
    });
    map.on("mouseenter", "places", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "places", () => { map.getCanvas().style.cursor = ""; });
  </script>
</body>
</html>

[project]
name = "placefinder"
version = "0.8.0"
description = "Place search API, example project of the cloud computing course"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-psycopg>=0.66b1",
    "opentelemetry-sdk>=1.45",
    "psycopg-pool>=3.3",
    "psycopg[binary]>=3.3",
    "valkey>=6.1",
]

[project.scripts]
placefinder-load = "placefinder.load:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
